{% set name = "gwtc_analysis" %}
{% set version = "0.8.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/g/gwtc-analysis/gwtc_analysis-{{ version }}.tar.gz
  sha256: 3a1dc6fa14b62f346223f49eb2f302624ec174a1c25f8b46b4b5067899aa4a9b

build:
  # py>=314: pycbc, pyseobnr and ligo.skymap have no Python 3.14 builds yet
  skip: true  # [win or py>=314]
  number: 0
  entry_points:
    - gwtc_analysis = gwtc_analysis.cli:main
  script:
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - astropy-base
    - gwosc
    - gwpy
    - h5py
    - healpy
    - ligo.skymap
    - pesummary >=1.6
    - pycbc
    - pyseobnr
    - bibtexparser
    - pyyaml
    - numpy
    - pandas
    - matplotlib-base
    - minio
    # 0.8.0: waveforms and strain (lal, lalsimulation), sky maps (astropy-healpix, reproject), PE files read over
    # HTTP (fsspec + aiohttp), Bayesian fits (bilby with dynesty, emcee)
    - lalsuite
    - astropy-healpix
    - reproject
    - fsspec
    - aiohttp
    - bilby
    - dynesty
    - emcee
    # indirect (ligo.skymap -> reproject -> dask): without it the solver picks dask 2023.3, which fails with NumPy 2
    - dask-core >=2024.8
    - requests
    - scipy
    - tqdm

test:
  imports:
    - gwtc_analysis
  commands:
    - gwtc_analysis --help
    - gwtc_analysis parameters_estimation -h
    - gwtc_analysis hubble_constant -h
  requires:
    - pip

about:
  home: https://pypi.org/project/gwtc-analysis/
  dev_url: https://github.com/danielsentenac/gwtc_analysis
  summary: GWTC analysis utilities
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - danielsentenac
