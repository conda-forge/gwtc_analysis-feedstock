{% set name = "gwtc_analysis" %}
{% set version = "0.5.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/g/gwtc-analysis/gwtc_analysis-{{ version }}.tar.gz
  sha256: e66f9bc89f60e7190b2b7f3ced48b8a33024f11dded021e9ef918f92d1aef5cb

build:
  skip: true  # [win]
  # pycbc, pyseobnr and ligo.skymap have no Python 3.14 builds yet
  skip: true  # [py>=314]
  number: 0
  entry_points:
    - gwtc_analysis = gwtc_analysis.cli:main
  script:
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - astropy-base
    - gwosc
    - gwpy
    - h5py
    - healpy
    - ligo.skymap
    - pesummary >=1.6
    - pycbc
    - pyseobnr
    - bibtexparser
    - pyyaml
    - numpy
    - pandas
    - matplotlib-base
    - minio
    # indirect (ligo.skymap -> reproject -> dask): without it the solver picks dask 2023.3, which fails with NumPy 2
    - dask-core >=2024.8
    - requests
    - scipy
    - tqdm

test:
  imports:
    - gwtc_analysis
  commands:
    - gwtc_analysis --help
    - gwtc_analysis parameters_estimation -h
  requires:
    - pip

about:
  home: https://pypi.org/project/gwtc-analysis/
  dev_url: https://github.com/danielsentenac/gwtc_analysis
  summary: GWTC analysis utilities
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - danielsentenac
